<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fantasy World Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #1c1815;
    font-family: 'Georgia', 'Iowan Old Style', serif;
  }

  #map {
    width: 100%;
    height: 100vh;
    background: #1c1815;
  }

  /* Nearest-neighbor upscaling instead of smooth/blurred interpolation
     when zoomed past the image's native resolution. Comment this out
     (or set PIXELATE_ON_DEEP_ZOOM to false below) if you'd rather have
     the browser's default smooth blur instead. */
  .leaflet-image-layer {
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
  }

  /* Leaflet chrome, restyled to feel like parchment/ink rather than default blue */
  .leaflet-control-zoom a {
    background: #f4ecd8;
    color: #3a2f28;
    border-color: #a8926f !important;
  }
  .leaflet-control-zoom a:hover {
    background: #e8dcc0;
  }

  .leaflet-popup-content-wrapper {
    background: #f4ecd8;
    color: #2c231b;
    border-radius: 4px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }
  .leaflet-popup-tip {
    background: #f4ecd8;
  }
  .marker-popup h3 {
    margin: 0 0 4px 0;
    font-size: 1.05em;
    letter-spacing: 0.02em;
    color: #6b3a1f;
  }
  .marker-popup p {
    margin: 0;
    font-size: 0.92em;
    line-height: 1.4;
  }
  .marker-popup a {
    display: inline-block;
    margin-top: 6px;
    font-size: 0.85em;
    color: #8a4a24;
  }

  /* Legend */
  .legend {
    background: #f4ecd8;
    padding: 10px 14px;
    border-radius: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.35);
    font-size: 0.85em;
    color: #2c231b;
    line-height: 1.6;
  }
  .legend div { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  .legend div.disabled { opacity: 0.35; }
  .legend .swatch {
    width: 16px;
    height: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .leaflet-div-icon.shape-marker {
    background: transparent;
    border: none;
  }

  /* Coordinate picker */
  .coord-readout {
    background: rgba(28, 24, 21, 0.85);
    color: #e8dcc0;
    padding: 6px 10px;
    border-radius: 4px;
    font-family: 'Menlo', 'Consolas', monospace;
    font-size: 0.8em;
    pointer-events: none;
    white-space: nowrap;
  }

  .picker-panel {
    background: #f4ecd8;
    color: #2c231b;
    border-radius: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.35);
    font-size: 0.8em;
    width: 260px;
    max-height: 380px;
    display: flex;
    flex-direction: column;
  }
  .picker-panel .picker-header {
    padding: 8px 10px;
    font-weight: bold;
    border-bottom: 1px solid #a8926f;
  }
  .picker-panel .picker-mode {
    display: flex;
    gap: 14px;
    padding: 8px 10px;
    border-bottom: 1px solid #a8926f;
  }
  .picker-panel .picker-mode label {
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  }
  .picker-panel .picker-subheader {
    padding: 8px 10px 2px 10px;
    font-weight: bold;
  }
  .picker-panel .picker-actions {
    display: flex;
    gap: 6px;
    padding: 4px 10px 6px 10px;
  }
  .picker-panel .picker-actions button {
    flex: 1;
  }
  .picker-panel button {
    font-size: 0.85em;
    border: 1px solid #a8926f;
    background: #e8dcc0;
    border-radius: 3px;
    padding: 3px 6px;
    cursor: pointer;
  }
  .picker-panel .picker-list {
    overflow-y: auto;
    max-height: 130px;
    padding: 4px 0;
  }
  .picker-panel .picker-item {
    padding: 6px 10px;
    font-family: 'Menlo', 'Consolas', monospace;
    font-size: 0.85em;
    border-bottom: 1px dashed #cbb994;
    cursor: pointer;
  }
  .picker-panel .picker-item:hover {
    background: #e8dcc0;
  }
  .picker-panel .picker-empty {
    padding: 8px 10px;
    color: #7a6b55;
    font-style: italic;
  }
</style>
</head>
<body>

<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>

/* ============================================================
   1. MAP IMAGE
   Replace this with your own map's filename/path once ready.
   Any resolution works — bounds are calculated automatically
   below from the image's real pixel dimensions.
   ============================================================ */
const MAP_IMAGE_URL = "images/haron_topological.png";

/* ============================================================
   DEV TOOLS TOGGLE
   Set to false before sharing this page with actual users --
   the picker is a mapmaking aid, not something end users need.
   ============================================================ */
const ENABLE_COORDINATE_PICKER = true;

/* ============================================================
   2. GROUPS
   Defines marker categories: color, display label, and shape.
   Mirrors DataMaps' "groups" concept for an easy future migration.
   Supported shapes: "circle", "square", "diamond", "triangle", "star", "pin"
   ============================================================ */
const GROUPS = {
  city:    { label: "Cities",     color: "#c0392b", shape: "pin" },
  dungeon: { label: "Dungeons",   color: "#6c3483", shape: "square" },
  poi:     { label: "Points of Interest", color: "#1e8449", shape: "triangle" }
};

/* ============================================================
   3. MARKERS
   x / y are plain percentages of image width/height (0-100),
   NOT pixels. This keeps them independent of image resolution,
   so swapping in a bigger/smaller map image never breaks marker
   placement, and the values are trivial to port to DataMaps'
   own coordinate system later.

   Each marker uses its group's shape by default. Add a `shape`
   field to any marker to override that for just this one point
   (e.g. flag a special landmark with a star instead of its
   group's usual icon).
   ============================================================ */
const MARKERS = [
  { id: "m1", x: 30, y: 40, group: "city",    name: "Kingsreach",      description: "Capital of the Eastern Realm, seat of the Silver Throne.", link: "" },
  { id: "m2", x: 62, y: 25, group: "city",    name: "Port Callow",     description: "A busy trade harbor known for its lighthouse guild.", link: "", shape: "star" },
  { id: "m3", x: 48, y: 65, group: "dungeon", name: "The Sunken Crypt",description: "An old tomb complex, said to be cursed.", link: "" },
  { id: "m4", x: 75, y: 55, group: "poi",     name: "Whispering Falls",description: "A waterfall rumored to carry voices of the dead.", link: "" }
];

/* ============================================================
   4. BORDERS
   Region/territory outlines. Points use the same x/y percentage
   system as MARKERS, so you can gather them with the coordinate
   picker just like marker positions.

   - closed: true  -> a filled region (polygon), e.g. a kingdom's territory
   - closed: false -> an open line (polyline), e.g. a road or river
   - dashArray: e.g. "6,4" for a dashed line, or null for solid
   ============================================================ */
const BORDERS = [
  {
    id: "b1",
    name: "Esment",
    description: "TBD",
    link: "",
    color: "#8a2f2f",
    closed: true,
    weight: 2,
    dashArray: "6,4",
    fillOpacity: 0.07,
    points: [
      { x: 62.9, y: 11.7 }, { x: 63.2, y: 12.4 }, { x: 63, y: 12.8 }, { x: 63.2, y: 13.1 }, { x: 63.2, y: 13.5 }, { x: 63.5, y: 13.5 }, { x: 63.8, y: 14.1 }, { x: 64.1, y: 14.2 }, { x: 64.4, y: 15.7 }, { x: 64.2, y: 16.1 }, { x: 64.6, y: 16.6 }, { x: 64.6, y: 16.8 }, { x: 64.8, y: 17.1 }, { x: 65.4, y: 17.6 }, { x: 65.1, y: 17.9 }, { x: 65.1, y: 18.5 }, { x: 65.7, y: 18.7 }, { x: 66.3, y: 19.1 }, { x: 66.4, y: 19.5 }, { x: 66.3, y: 19.9 }, { x: 66.4, y: 20.6 }, { x: 66.2, y: 21.3 }, { x: 66.8, y: 21.8 }, { x: 66.9, y: 22.3 }, { x: 66.9, y: 23.2 }, { x: 67.1, y: 23.6 }, { x: 67.4, y: 23.7 }, { x: 67.7, y: 23.5 }, { x: 68.1, y: 23.2 }, { x: 68.4, y: 23.4 }, { x: 68.7, y: 23.3 }, { x: 68.8, y: 23.8 }, { x: 68.7, y: 24 }, { x: 69.1, y: 24.2 }, { x: 69.2, y: 24.4 }, { x: 69.2, y: 24.6 }, { x: 69.3, y: 24.8 }, { x: 69.4, y: 25.1 }, { x: 69.3, y: 25.4 }, { x: 69.1, y: 25.7 }, { x: 68.8, y: 25.6 }, { x: 68.5, y: 26 }, { x: 68.1, y: 26.4 }, { x: 67.8, y: 26.5 }, { x: 67.7, y: 26.1 }, { x: 67.5, y: 25.5 }, { x: 67, y: 25.1 }, { x: 66.6, y: 24.7 }, { x: 66.3, y: 24.2 }, { x: 66.1, y: 24.2 }, { x: 65.4, y: 24.7 }, { x: 64.6, y: 24.5 }, { x: 63.8, y: 23.9 }, { x: 63.2, y: 23.8 }, { x: 62.7, y: 24 }, { x: 62.4, y: 23.9 }, { x: 62.3, y: 23.5 }, { x: 62.2, y: 23 }, { x: 62.1, y: 22.6 }, { x: 62.1, y: 22.3 }, { x: 62.2, y: 22 }, { x: 62.4, y: 21.5 }, { x: 62.6, y: 21 }, { x: 62.6, y: 20.4 }, { x: 62.4, y: 20.2 }, { x: 62, y: 20.2 }, { x: 61.7, y: 20.1 }, { x: 61.5, y: 19.9 }, { x: 61.2, y: 19.5 }, { x: 61.1, y: 19.2 }, { x: 61.1, y: 18.8 }, { x: 60.9, y: 18.7 }, { x: 60.6, y: 18.7 }, { x: 60.4, y: 19 }, { x: 60.3, y: 19.2 }, { x: 60, y: 19.5 }, { x: 59.7, y: 19.5 }, { x: 59.4, y: 19.8 }, { x: 59, y: 19.9 }, { x: 58.9, y: 20.4 }, { x: 58.8, y: 20.8 }, { x: 58.5, y: 21 }, { x: 58.2, y: 21.4 }, { x: 57.8, y: 21.4 }, { x: 57.5, y: 21.6 }, { x: 57.1, y: 22 }, { x: 56.7, y: 22.1 }, { x: 56.5, y: 22.1 }, { x: 56.3, y: 21.7 }, { x: 56.1, y: 21.2 }, { x: 56.1, y: 20.6 }, { x: 55.9, y: 20.4 }, { x: 55.7, y: 20.3 }, { x: 55.5, y: 19.9 }, { x: 55.3, y: 19.7 }, { x: 55.1, y: 19.8 }, { x: 54.4, y: 19 }, { x: 54.5, y: 18.7 }, { x: 54.8, y: 18.7 }, { x: 55, y: 18.6 }, { x: 55.1, y: 18.2 }, { x: 55.1, y: 17.8 }, { x: 55.2, y: 16.8 }, { x: 55.3, y: 16.1 }, { x: 55.6, y: 16.2 }, { x: 55.6, y: 17.1 }, { x: 55.8, y: 17.7 }, { x: 55.8, y: 18.3 }, { x: 56, y: 18.1 }, { x: 56.2, y: 17.8 }, { x: 56.4, y: 17.7 }, { x: 56.7, y: 17 }, { x: 56.9, y: 16.9 }, { x: 57.2, y: 17.3 }, { x: 57.3, y: 16.6 }, { x: 57.5, y: 16.1 }, { x: 57.9, y: 15.4 }, { x: 58.1, y: 14.8 }, { x: 58.6, y: 14.7 }, { x: 58.8, y: 14.9 }, { x: 59.3, y: 14.7 }, { x: 59.3, y: 14.1 }, { x: 59.1, y: 13.6 }, { x: 59.2, y: 13.2 }, { x: 59.7, y: 13.2 }, { x: 60.2, y: 13.3 }, { x: 60.6, y: 13.2 }, { x: 60.9, y: 13.4 }, { x: 61.2, y: 13.4 }, { x: 61.6, y: 14.2 }, { x: 62.1, y: 14.8 }, { x: 62.2, y: 15.2 }, { x: 62.5, y: 15.1 }, { x: 62.6, y: 14.4 }, { x: 62.3, y: 14 }, { x: 62.4, y: 13.3 }, { x: 62.3, y: 12.8 }, { x: 62.2, y: 11.9 }, { x: 62.3, y: 11.3 }, { x: 62.6, y: 11.3 }, { x: 62.9, y: 11.3 }, { x: 62.9, y: 11.7 }
    ]
  }
];

/* ============================================================
   MARKER SHAPES
   Renders a small inline SVG for each supported shape. These are
   real vector shapes (not raster images), so they stay crisp at
   any zoom level regardless of the map image's own resolution.
   ============================================================ */
function shapeSVG(shape, color, size) {
  const stroke = "#2c231b";
  const s = size || 20;
  switch (shape) {
    case "square":
      return `<svg width="${s}" height="${s}" viewBox="0 0 20 20"><rect x="2" y="2" width="16" height="16" rx="2" fill="${color}" stroke="${stroke}" stroke-width="1.6" fill-opacity="0.9"/></svg>`;
    case "diamond":
      return `<svg width="${s}" height="${s}" viewBox="0 0 20 20"><rect x="4.3" y="4.3" width="11.4" height="11.4" rx="1.5" fill="${color}" stroke="${stroke}" stroke-width="1.6" fill-opacity="0.9" transform="rotate(45 10 10)"/></svg>`;
    case "triangle":
      return `<svg width="${s}" height="${s}" viewBox="0 0 20 20"><polygon points="10,2 18,18 2,18" fill="${color}" stroke="${stroke}" stroke-width="1.6" stroke-linejoin="round" fill-opacity="0.9"/></svg>`;
    case "star":
      return `<svg width="${s}" height="${s}" viewBox="0 0 20 20"><polygon points="10,1 12.5,7 19,7.5 14,12 15.5,18.5 10,15 4.5,18.5 6,12 1,7.5 7.5,7" fill="${color}" stroke="${stroke}" stroke-width="1.3" stroke-linejoin="round" fill-opacity="0.9"/></svg>`;
    case "pin": {
      const h = s * 1.4; // pins are inherently taller than they are wide (they need a point); width still matches the other shapes
      return `<svg width="${s}" height="${h}" viewBox="0 0 20 28"><path d="M10 0C4.5 0 0 4.3 0 9.5C0 16 10 27 10 27S20 16 20 9.5C20 4.3 15.5 0 10 0Z" fill="${color}" stroke="${stroke}" stroke-width="1.4" fill-opacity="0.92"/><circle cx="10" cy="9.5" r="3.4" fill="${stroke}" fill-opacity="0.85"/></svg>`;
    }
    case "circle":
    default:
      return `<svg width="${s}" height="${s}" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="${color}" stroke="${stroke}" stroke-width="1.6" fill-opacity="0.9"/></svg>`;
  }
}

function makeShapeIcon(shape, color) {
  const isPin = shape === "pin";
  const size = 20; // shared base size across every shape
  const height = isPin ? size * 1.4 : size;
  return L.divIcon({
    className: "shape-marker",
    html: shapeSVG(shape, color, size),
    iconSize: [size, height],
    iconAnchor: isPin ? [size / 2, height] : [size / 2, size / 2],
    popupAnchor: isPin ? [0, -height + 4] : [0, -size / 2 - 2]
  });
}

// With CRS.Simple, lat/lng ARE pixel coordinates directly (lat = row from
// bottom, lng = column from left) -- no projection math needed. x/y here
// are percentages (0-100) of the image, matching MARKERS/BORDERS below.
function toLatLng(xPercent, yPercent, w, h) {
  return L.latLng((yPercent / 100) * h, (xPercent / 100) * w);
}

/* ============================================================
   BUILD THE MAP
   ============================================================ */
const map = L.map('map', {
  crs: L.CRS.Simple,
  zoomSnap: 0,      // allow fractional zoom so the image can fit the screen EXACTLY, not rounded to the nearest whole step
  zoomDelta: 0.5,   // smaller steps for the +/- buttons since we're not snapping to whole numbers
  attributionControl: false
});

const img = new Image();
img.onload = function () {
  const w = img.naturalWidth;
  const h = img.naturalHeight;

  // Bounds in Leaflet's [y, x] pixel-space convention
  const bounds = [[0, 0], [h, w]];
  L.imageOverlay(MAP_IMAGE_URL, bounds).addTo(map);

  // With CRS.Simple and bounds defined in raw image pixels, zoom level 0 is
  // this image's native 1:1 resolution. Past that, the browser is stretching
  // pixels rather than showing new detail -- but since we render that
  // stretch as crisp nearest-neighbor (see .leaflet-image-layer CSS above)
  // rather than a blur, it's fine to allow some extra zoom for inspecting
  // detail. Raise/lower DEEP_ZOOM_LEVELS to taste, or set it to 0 to hard-cap
  // at native resolution.
  const NATIVE_ZOOM = 0;
  const DEEP_ZOOM_LEVELS = 3;
  const fitZoom = map.getBoundsZoom(bounds);
  const maxZoom = Math.max(NATIVE_ZOOM + DEEP_ZOOM_LEVELS, fitZoom);
  map.setMinZoom(fitZoom - 3);
  map.setMaxZoom(maxZoom);

  map.fitBounds(bounds);
  map.setMaxBounds(bounds);

  const layerGroups = {};
  Object.keys(GROUPS).forEach(key => {
    layerGroups[key] = L.layerGroup().addTo(map);
  });

  MARKERS.forEach(m => {
    const groupInfo = GROUPS[m.group] || { color: "#333" };
    const latlng = toLatLng(m.x, m.y, w, h);

    const marker = L.marker(latlng, {
      icon: makeShapeIcon(m.shape || groupInfo.shape || "circle", groupInfo.color)
    });

    const linkHtml = m.link ? `<a href="${m.link}">More details &rarr;</a>` : "";
    marker.bindPopup(
      `<div class="marker-popup"><h3>${m.name}</h3><p>${m.description}</p>${linkHtml}</div>`
    );

    marker.on('click', (e) => L.DomEvent.stopPropagation(e));
    marker.addTo(layerGroups[m.group]);
  });

  const borderLayer = L.layerGroup().addTo(map);
  BORDERS.forEach(b => {
    const latlngs = b.points.map(p => toLatLng(p.x, p.y, w, h));
    const baseStyle = {
      color: b.color || "#5a3a2a",
      weight: b.weight || 2,
      dashArray: b.dashArray || null,
      fill: !!b.closed,
      fillColor: b.color || "#5a3a2a",
      fillOpacity: b.closed ? (b.fillOpacity ?? 0.08) : 0
    };
    const hoverStyle = {
      weight: (b.weight || 2) + 1.5,
      fillOpacity: b.closed ? (b.fillOpacity ?? 0.08) * 3.5 : 0
    };
    const layer = b.closed ? L.polygon(latlngs, baseStyle) : L.polyline(latlngs, baseStyle);

    // Translucent hover highlight -- makes a region feel clickable/alive
    // rather than just a static outline.
    layer.on('mouseover', () => layer.setStyle(hoverStyle));
    layer.on('mouseout', () => layer.setStyle(baseStyle));

    if (b.name || b.description) {
      const linkHtml = b.link ? `<a href="${b.link}">More details &rarr;</a>` : "";
      layer.bindPopup(
        `<div class="marker-popup"><h3>${b.name || ""}</h3><p>${b.description || ""}</p>${linkHtml}</div>`
      );
    }

    layer.on('click', (e) => L.DomEvent.stopPropagation(e));
    layer.addTo(borderLayer);
  });

  buildLegend(layerGroups, borderLayer);
  if (ENABLE_COORDINATE_PICKER) buildCoordinatePicker(w, h);
};
img.src = MAP_IMAGE_URL;

function buildCoordinatePicker(w, h) {
  const picked = [];           // finished single points
  const finishedBorders = [];  // finished border/region shapes: { points, closed }
  let drawing = [];            // in-progress border points (percent coords)
  let mode = 'point';          // 'point' | 'border'

  const previewLayer = L.layerGroup().addTo(map);

  // Live x/y readout that follows the cursor
  const readout = L.control({ position: 'bottomleft' });
  readout.onAdd = function () {
    const div = L.DomUtil.create('div', 'coord-readout');
    div.innerHTML = 'x: --, y: --';
    return div;
  };
  readout.addTo(map);
  const readoutEl = document.querySelector('.coord-readout');

  function toPercent(latlng) {
    const x = (latlng.lng / w) * 100;
    const y = (latlng.lat / h) * 100;
    return { x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10 };
  }

  map.on('mousemove', (e) => {
    const { x, y } = toPercent(e.latlng);
    readoutEl.innerHTML = `x: ${x}, y: ${y}`;
  });

  function redrawPreview() {
    previewLayer.clearLayers();
    if (drawing.length === 0) return;
    const latlngs = drawing.map(p => toLatLng(p.x, p.y, w, h));
    if (latlngs.length > 1) {
      L.polyline(latlngs, { color: '#2a6ebb', weight: 2, dashArray: '4,3', interactive: false }).addTo(previewLayer);
    }
    drawing.forEach(p => {
      L.circleMarker(toLatLng(p.x, p.y, w, h), {
        radius: 4, color: '#2a6ebb', weight: 2, fillColor: '#fff', fillOpacity: 1, interactive: false
      }).addTo(previewLayer);
    });
    document.getElementById('drawing-count').textContent = drawing.length;
  }

  // Main panel
  const panel = L.control({ position: 'bottomright' });
  panel.onAdd = function () {
    const div = L.DomUtil.create('div', 'picker-panel');
    div.innerHTML = `
      <div class="picker-header">Map Tools</div>
      <div class="picker-mode">
        <label><input type="radio" name="picker-mode" value="point" checked> Points</label>
        <label><input type="radio" name="picker-mode" value="border"> Border</label>
      </div>

      <div id="picker-point-section">
        <div class="picker-subheader">Picked points (<span id="point-count">0</span>)</div>
        <div class="picker-actions">
          <button id="picker-copy-all">Copy all</button>
          <button id="picker-clear">Clear</button>
        </div>
        <div class="picker-list" id="picker-list">
          <div class="picker-empty">Click the map to record a point.</div>
        </div>
      </div>

      <div id="picker-border-section" style="display:none">
        <div class="picker-subheader">Drawing (<span id="drawing-count">0</span> pts)</div>
        <div class="picker-actions">
          <button id="border-undo">Undo point</button>
          <button id="border-cancel">Cancel</button>
        </div>
        <div class="picker-actions">
          <button id="border-finish-region">Finish region</button>
          <button id="border-finish-line">Finish line</button>
        </div>
        <div class="picker-subheader">Finished borders (<span id="border-count">0</span>)</div>
        <div class="picker-actions">
          <button id="border-copy-all">Copy all</button>
          <button id="border-clear">Clear</button>
        </div>
        <div class="picker-list" id="border-list">
          <div class="picker-empty">Click to place points, then Finish.</div>
        </div>
      </div>
    `;
    L.DomEvent.disableClickPropagation(div);
    return div;
  };
  panel.addTo(map);

  // -- Mode switching --
  document.querySelectorAll('input[name="picker-mode"]').forEach(radio => {
    radio.addEventListener('change', (e) => {
      mode = e.target.value;
      document.getElementById('picker-point-section').style.display = mode === 'point' ? '' : 'none';
      document.getElementById('picker-border-section').style.display = mode === 'border' ? '' : 'none';
    });
  });

  // -- Single point mode --
  function pointSnippetFor(pt, idx) {
    return `{ id: "m${idx}", x: ${pt.x}, y: ${pt.y}, group: "city", name: "Unnamed", description: "", link: "" }`;
  }

  function renderPointList() {
    const list = document.getElementById('picker-list');
    document.getElementById('point-count').textContent = picked.length;
    if (picked.length === 0) {
      list.innerHTML = '<div class="picker-empty">Click the map to record a point.</div>';
      return;
    }
    list.innerHTML = '';
    picked.forEach((pt, idx) => {
      const item = document.createElement('div');
      item.className = 'picker-item';
      item.textContent = pointSnippetFor(pt, idx + 1);
      item.title = 'Click to copy this line';
      item.onclick = () => navigator.clipboard.writeText(pointSnippetFor(pt, idx + 1));
      list.appendChild(item);
    });
  }

  // -- Border/region mode --
  function borderSnippetFor(b, idx) {
    const ptsStr = b.points.map(p => `{ x: ${p.x}, y: ${p.y} }`).join(', ');
    return `{ id: "b${idx}", name: "Unnamed", description: "", link: "", color: "#5a3a2a", closed: ${b.closed}, weight: 2, dashArray: null, fillOpacity: 0.08, points: [ ${ptsStr} ] }`;
  }

  function renderBorderList() {
    const list = document.getElementById('border-list');
    document.getElementById('border-count').textContent = finishedBorders.length;
    if (finishedBorders.length === 0) {
      list.innerHTML = '<div class="picker-empty">Click to place points, then Finish.</div>';
      return;
    }
    list.innerHTML = '';
    finishedBorders.forEach((b, idx) => {
      const item = document.createElement('div');
      item.className = 'picker-item';
      item.textContent = `${b.closed ? 'Region' : 'Line'} ${idx + 1} (${b.points.length} pts)`;
      item.title = 'Click to copy this border object';
      item.onclick = () => navigator.clipboard.writeText(borderSnippetFor(b, idx + 1));
      list.appendChild(item);
    });
  }

  function finishDrawing(closed) {
    const minPoints = closed ? 3 : 2;
    if (drawing.length < minPoints) {
      alert(`Need at least ${minPoints} points to finish a ${closed ? 'region' : 'line'}.`);
      return;
    }
    finishedBorders.push({ points: drawing.slice(), closed });
    drawing = [];
    redrawPreview();
    renderBorderList();
  }

  // -- Map click: add a point or a border vertex depending on mode --
  map.on('click', (e) => {
    const pt = toPercent(e.latlng);
    if (mode === 'point') {
      picked.push(pt);
      renderPointList();
    } else {
      drawing.push(pt);
      redrawPreview();
    }
  });

  // -- Button wiring --
  document.addEventListener('click', (e) => {
    const id = e.target && e.target.id;
    if (id === 'picker-copy-all') {
      navigator.clipboard.writeText(picked.map((pt, idx) => pointSnippetFor(pt, idx + 1)).join(',\n'));
    } else if (id === 'picker-clear') {
      picked.length = 0;
      renderPointList();
    } else if (id === 'border-undo') {
      drawing.pop();
      redrawPreview();
    } else if (id === 'border-cancel') {
      drawing = [];
      redrawPreview();
    } else if (id === 'border-finish-region') {
      finishDrawing(true);
    } else if (id === 'border-finish-line') {
      finishDrawing(false);
    } else if (id === 'border-copy-all') {
      navigator.clipboard.writeText(finishedBorders.map((b, idx) => borderSnippetFor(b, idx + 1)).join(',\n'));
    } else if (id === 'border-clear') {
      finishedBorders.length = 0;
      renderBorderList();
    }
  });
}

function buildLegend(layerGroups, borderLayer) {
  const legend = L.control({ position: 'topright' });
  legend.onAdd = function () {
    const div = L.DomUtil.create('div', 'legend');
    Object.entries(GROUPS).forEach(([key, info]) => {
      const row = document.createElement('div');
      row.innerHTML = `<span class="swatch">${shapeSVG(info.shape || "circle", info.color, 14)}</span>${info.label}`;
      row.onclick = () => {
        const layer = layerGroups[key];
        if (map.hasLayer(layer)) {
          map.removeLayer(layer);
          row.classList.add('disabled');
        } else {
          map.addLayer(layer);
          row.classList.remove('disabled');
        }
      };
      div.appendChild(row);
    });

    if (borderLayer) {
      const row = document.createElement('div');
      const lineSwatch = `<svg width="14" height="14" viewBox="0 0 14 14"><line x1="1" y1="11" x2="13" y2="3" stroke="#5a3a2a" stroke-width="2" stroke-dasharray="3,2"/></svg>`;
      row.innerHTML = `<span class="swatch">${lineSwatch}</span>Borders`;
      row.onclick = () => {
        if (map.hasLayer(borderLayer)) {
          map.removeLayer(borderLayer);
          row.classList.add('disabled');
        } else {
          map.addLayer(borderLayer);
          row.classList.remove('disabled');
        }
      };
      div.appendChild(row);
    }

    return div;
  };
  legend.addTo(map);
}
</script>
